# CI workflow — generated by kinfra init
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - name: Install dependencies
        run: uv sync --all-groups --all-extras
      - name: Quality + tests
        run: make check
      - name: Report new public surface
        if: github.event_name == 'pull_request'
        run: python3 .devops-ai/check_public_surface.py "${{ github.event.pull_request.base.sha }}"
      - name: Protect independent grader
        if: github.event_name == 'pull_request'
        run: |
          git show "${{ github.event.pull_request.base.sha }}:.devops-ai/check_contract_integrity.py" > "$RUNNER_TEMP/check_contract_integrity.py" 2>/dev/null \
            || cp .devops-ai/check_contract_integrity.py "$RUNNER_TEMP/check_contract_integrity.py"
          python3 "$RUNNER_TEMP/check_contract_integrity.py" "${{ github.event.pull_request.base.sha }}" "$GITHUB_HEAD_REF"
