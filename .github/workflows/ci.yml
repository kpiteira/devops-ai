# CI workflow — generated by kinfra init
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --group dev
      - name: Quality + tests
        run: make check

  ai-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Review this PR. Check:
            1. Code quality and correctness
            2. New features covered by unit tests in tests/unit/?
            3. Unit tests avoid real I/O? (no network, subprocess, Docker)
            4. For significant features: what E2E scenarios should cover this?
            5. Security concerns and breaking changes
            If test coverage is clearly inadequate, request changes.
